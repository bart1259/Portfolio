<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Portfolio of Bartek Gebka, a software engineer specializing in artificial intelligence, GPU programming, computer graphics, and full-stack development.">

    <title>Bart(ek) Gebka - Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet">

    <script src="projects.js"></script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QT85V1PFLR"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag("js", new Date());
        gtag("config", "G-QT85V1PFLR");
    </script>

    <style>
        :root {
            --black: #000000;
            --dark: #181818;
            --gray: #555555;
            --gold: #edb926;
            --yellow: #f1d217;

            --section-bg: rgba(0, 0, 0, 0.89);
            --section-bg-alt: rgba(28, 28, 28, 0.92);
        }

        /* ---------- RESET ---------- */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--yellow);
            font-family: "Poppins", sans-serif;
            background: var(--black);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ---------- RANDOM BACKGROUND ---------- */

        #site-background {
            position: fixed;
            inset: 0;
            z-index: 0;

            background-color: var(--black);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
        }

        #site-background::after {
            content: "";
            position: absolute;
            inset: 0;

            background: #000000;
            opacity: var(--background-overlay-opacity, 0.45);

            pointer-events: none;
        }

        nav,
        header,
        main,
        footer {
            position: relative;
            z-index: 1;
        }

        /*
            This label sits in the bottom-left corner of the
            selected Cities or Ringworld image.
        */
        #hero {
            position: relative;
        }

        .background-caption {
            position: absolute;
            bottom: 1.25rem;
            left: 1.25rem;
            z-index: 2;

            max-width: min(460px, calc(100% - 2.5rem));
            padding: 0.45rem 0.65rem;

            color: #ffffff;
            font-size: 0.7rem;
            line-height: 1.4;

            background: rgba(0, 0, 0, 0.78);
            border-radius: 3px;
        }

        .background-caption strong {
            display: block;
            margin-bottom: 0.08rem;

            color: #ffffff;
            font-size: 0.7rem;
            font-weight: 600;
        }

        /* ---------- NAVIGATION ---------- */

        nav {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            width: 100%;
            height: 60px;
            padding: 0 2rem;

            background: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid rgba(237, 185, 38, 0.15);
            backdrop-filter: blur(8px);
        }

        .logo {
            color: var(--gold);
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .nav-links {
            display: flex;
            gap: 1.3rem;
            list-style: none;
            color: #ffffff;
            font-size: 0.85rem;
        }

        .nav-links a {
            transition: color 0.2s ease;
        }

        .nav-links a:hover,
        .nav-links a:focus-visible {
            color: var(--gold);
        }

        /* ---------- HERO ---------- */

        #hero {
            display: grid;
            min-height: 100vh;
            padding: 90px 1.5rem 4rem;
            place-items: center;
        }

        .intro {
            width: min(1100px, 100%);
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
        }

        .intro h1 {
            line-height: 1.22;
        }

        .intro-1,
        .intro-2,
        .intro-3,
        .specialty-link,
        .scroll-message,
        .scroll-arrow {
            opacity: 0;
            animation: fade-slide 0.85s forwards;
        }

        .intro-1,
        .intro-2 {
            display: inline-block;
            font-size: clamp(2.2rem, 5vw, 4.5rem);
            font-weight: 700;
        }

        .intro-1 {
            animation-delay: 0.2s;
        }

        .intro-2 {
            animation-delay: 1.1s;
        }

        .intro-3 {
            display: block;
            margin-top: 1.1rem;
            font-size: clamp(1.05rem, 2.3vw, 2rem);
            font-weight: 600;
            animation-delay: 2s;
        }

        .specialties {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem 1.5rem;
            margin-top: 1.5rem;
        }

        .specialty-link {
            font-size: clamp(1rem, 2vw, 1.45rem);
            font-weight: 600;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .specialty-link:hover,
        .specialty-link:focus-visible {
            color: #ffffff;
            transform: translateY(-3px);
        }

        .specialty-link:nth-child(1) {
            color: #ffb3ba;
            animation-delay: 2.9s;
        }

        .specialty-link:nth-child(2) {
            color: #bae1ff;
            animation-delay: 3.25s;
        }

        .specialty-link:nth-child(3) {
            color: #baffc9;
            animation-delay: 3.6s;
        }

        .specialty-link:nth-child(4) {
            color: #ffffba;
            animation-delay: 3.95s;
        }

        .scroll-message {
            display: block;
            margin-top: 3rem;
            font-size: 1rem;
            animation-delay: 4.6s;
        }

        .scroll-arrow {
            display: block;
            margin-top: 0.25rem;
            font-size: 1.2rem;
            animation-delay: 4.95s;
        }

        /* ---------- PROJECT SECTIONS ---------- */

        section.area {
            padding: 6rem 8vw;
            background: var(--section-bg);
            border-top: 1px solid rgba(237, 185, 38, 0.1);
            backdrop-filter: blur(5px);
        }

        section.area:nth-child(even) {
            background: var(--section-bg-alt);
        }

        section.area h2 {
            margin-bottom: 2rem;
            color: var(--gold);
            font-size: clamp(1.8rem, 4vw, 2.3rem);
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .card {
            display: flex;
            flex-direction: column;
            min-height: 100%;
            overflow: hidden;

            background: rgba(65, 65, 65, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;

            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .card:hover,
        .card:focus-visible {
            outline: none;
            border-color: rgba(237, 185, 38, 0.75);
            box-shadow: 0 0 25px rgba(237, 185, 38, 0.4);
            transform: translateY(-6px);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: var(--dark);
        }

        .p-body {
            display: flex;
            flex: 1;
            flex-direction: column;
            padding: 1rem;
        }

        .p-body h3 {
            margin-bottom: 0.5rem;
            color: var(--yellow);
            font-size: 1.2rem;
            line-height: 1.3;
        }

        .p-body p {
            color: #eeeeee;
            font-size: 0.9rem;
            line-height: 1.55;
        }

        .technologies {
            margin-top: auto;
            padding-top: 0.75rem;
        }

        .pill {
            display: inline-block;
            margin: 0.25rem 0.25rem 0 0;
            padding: 0.2rem 0.6rem;

            color: var(--black);
            font-size: 0.72rem;
            font-weight: 600;

            background: var(--gold);
            border-radius: 4px;
        }

        /* ---------- FOOTER ---------- */

        footer {
            padding: 2rem 1rem;
            color: #bdbdbd;
            font-size: 0.85rem;
            text-align: center;
            background: rgba(0, 0, 0, 0.94);
        }

        /* ---------- ANIMATION ---------- */

        @keyframes fade-slide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- SCROLLBAR ---------- */

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--black);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--gray);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--gold);
        }

        /* ---------- MOBILE ---------- */

        @media (max-width: 700px) {
            nav {
                padding: 0 1rem;
            }

            .nav-links {
                gap: 0.8rem;
                font-size: 0.72rem;
            }

            section.area {
                padding: 4rem 1.25rem;
            }

            .background-caption {
                bottom: 0.75rem;
                left: 0.75rem;
                max-width: calc(100vw - 1.5rem);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <!-- Randomly selected image from BACKGROUNDS in projects.js -->
    <div id="site-background" aria-hidden="true"></div>

    <nav>
        <a class="logo" href="#hero" aria-label="Back to top">BG</a>

        <ul class="nav-links">
            <li><a href="#machine_learning_and_ai">AI</a></li>
            <li><a href="#gpu_programming_computer_graphics">Graphics</a></li>
            <li><a href="#unity_games">Games</a></li>
            <li><a href="#other">Other</a></li>
        </ul>
    </nav>

    <header id="hero">
        <div class="intro">
            <h1>
                <span class="intro-1">Hi!</span>
                <span class="intro-2">&nbsp;I'm Bartek</span>
            </h1>

            <h2 class="intro-3">
                A software engineer in Milwaukee specializing in
            </h2>

            <div class="specialties">
                <a class="specialty-link" href="#machine_learning_and_ai">
                    Artificial Intelligence
                </a>

                <a class="specialty-link" href="#gpu_programming_computer_graphics">
                    GPU Programming
                </a>

                <a class="specialty-link" href="#gpu_programming_computer_graphics">
                    Computer Graphics
                </a>

                <a class="specialty-link" href="#other">
                    Full-Stack Development
                </a>
            </div>

            <span class="scroll-message">Scroll down to see my work</span>
            <span class="scroll-arrow" aria-hidden="true">▼</span>
        </div>
        <aside class="background-caption" id="background-caption">
            <strong id="background-title">Background artwork</strong>
            <span id="background-annotation"></span>
        </aside>
    </header>

    <main id="projects"></main>

    <footer id="footer"></footer>

    <script>
        function escapeHTML(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll("\"", "&quot;")
                .replaceAll("'", "&#039;");
        }

        function slugify(value) {
            return value
                .toLowerCase()
                .replaceAll("&", "and")
                .replace(/[^a-z0-9]+/g, "_")
                .replace(/^_|_$/g, "");
        }

        function getProjectHTML(project) {
            const technologyPills = project.technologies
                .map((technology) => {
                    return `<span class="pill">${escapeHTML(technology)}</span>`;
                })
                .join("");

            return `
                <a
                    class="card"
                    href="${escapeHTML(project.link)}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <img
                        src="${escapeHTML(project.image)}"
                        alt="${escapeHTML(project.name)} project preview"
                        loading="lazy"
                    >

                    <div class="p-body">
                        <h3>${escapeHTML(project.name)}</h3>

                        <p>${escapeHTML(project.description)}</p>

                        <div class="technologies">
                            ${technologyPills}
                        </div>
                    </div>
                </a>
            `;
        }

        function getSectionHTML(sectionName) {
            const projectsInSection = PROJECTS
                .filter((project) => project.featured === sectionName)

            return `
                <section class="area" id="${slugify(sectionName)}">
                    <h2>${escapeHTML(sectionName)}</h2>

                    <div class="project-grid">
                        ${projectsInSection.map(getProjectHTML).join("")}
                    </div>
                </section>
            `;
        }

        function renderProjects() {
            const sectionNames = [
                ...new Set(
                    PROJECTS
                        .map((project) => project.featured)
                        .filter(Boolean)
                )
            ];

            const projectsElement = document.getElementById("projects");

            projectsElement.innerHTML = sectionNames
                .map(getSectionHTML)
                .join("");
        }

        function chooseRandomBackground() {
            if (typeof BACKGROUNDS === "undefined" || BACKGROUNDS.length === 0) {
                return;
            }

            const randomIndex = Math.floor(Math.random() * BACKGROUNDS.length);
            const selectedBackground = BACKGROUNDS[randomIndex];

            const backgroundElement = document.getElementById("site-background");
            const titleElement = document.getElementById("background-title");
            const annotationElement = document.getElementById("background-annotation");

            backgroundElement.style.backgroundImage =
                `url("${selectedBackground.image}")`;

            backgroundElement.style.setProperty(
                "--background-overlay-opacity",
                selectedBackground.opacity ?? 0.45
            );

            titleElement.textContent =
                selectedBackground.title || "Background artwork";

            annotationElement.textContent =
                selectedBackground.annotation || "";
        }

        window.addEventListener("DOMContentLoaded", () => {
            chooseRandomBackground();
            renderProjects();

            document.getElementById("footer").textContent =
                `© ${new Date().getFullYear()} Bart Gebka. All rights reserved.`;
        });
    </script>
</body>

</html>
